name: Test Ubuntu

on:  [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        #python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        #cxx: [g++, clang++]
        #std: [c++11, c++14, c++17]
        python-version: ['3.14']
        cxx: [g++]
        std: [c++11]
        include:
          # Add the appropriate docker image for each compiler.
          # The images from teeks99/boost-python-test already have boost::python
          # pre-reqs installed, see:
          # https://github.com/teeks99/boost-python-test-docker
          - cxx: clang++
            docker-img: teeks99/boost-python-test:clang-21_1.89.0
          - cxx: g++
            docker-img: teeks99/boost-python-test:gcc-15_1.89.0

    container:
      image: ${{ matrix.docker-img }}

    steps:
    - uses: actions/checkout@v5
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: setup prerequisites
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -U faber
    - name: build
      run: |
        which python3
        python3 --version
        ${{ matrix.cxx }} --version
        faber -v
        sed -e "s/\$PYTHON/python3/g" .ci/faber > ~/.faber
        echo "PY_INC=$(python3 -c 'import sysconfig;print(sysconfig.get_config_var(\'INCLUDEPY\'))')" >> $GITHUB_ENV
        echo "PY_INC=${PY_INC}"
        # faber clobbers the LD_LIBRARY_PATH env var
        echo "${Python_ROOT_DIR}" > /etc/ld.so.conf.d/boost-ci.conf && ldconfig -v
        faber \
          --with-boost-include=${BOOST_PY_DEPS} \
          --builddir=build \
          cxx.name=${{ matrix.cxx }} \
          cxxflags=-std=${{ matrix.std }} \
          cppflags=-std=${{ matrix.std }} \
          include="${PY_INC}" \
          -j`nproc`
    - name: test
      run: |
        faber \
          --with-boost-include=${BOOST_PY_DEPS} \
          --builddir=build \
          cxx.name=${{ matrix.cxx }} \
          cxxflags=-std=${{ matrix.std }} \
          cppflags=-std=${{ matrix.std }} \
          include="${PY_INC}" \
          -j`nproc` \
          test.report
